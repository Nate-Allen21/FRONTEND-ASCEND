<svg width="720" height="620" viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .guide-title { fill: #F5F7FB; font-family: "Arial Black", "Segoe UI", Arial, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
    .guide-subtitle { fill: #9FB0C8; font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 500; }
    .card-title { font-family: "Arial Black", "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
    .card-copy { fill: #F5F7FB; font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 500; }
    .footer-copy { fill: #7F91AD; font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 500; }
  </style>
  <rect width="720" height="620" rx="28" fill="#080C14"/>
  <rect x="18" y="18" width="684" height="584" rx="22" fill="url(#panel)"/>
  <text x="40" y="58" class="guide-title">GUIA RAPIDO DE BIOTIPOS</text>
  <text x="40" y="88" class="guide-subtitle">Use como referencia inicial, nao como diagnostico fixo.</text>

  <g transform="translate(40 126)">
    <rect width="190" height="414" rx="20" fill="#0F1622" stroke="#1ED4FF" stroke-opacity="0.35"/>
    <text x="24" y="36" class="card-title" fill="#DFF7FF">ECTOMORFO</text>
    <ellipse cx="95" cy="84" rx="22" ry="24" fill="#58C8FF"/>
    <rect x="84" y="108" width="22" height="80" rx="11" fill="#58C8FF"/>
    <rect x="66" y="116" width="14" height="72" rx="7" fill="#58C8FF"/>
    <rect x="110" y="116" width="14" height="72" rx="7" fill="#58C8FF"/>
    <rect x="78" y="188" width="12" height="58" rx="6" fill="#58C8FF"/>
    <rect x="100" y="188" width="12" height="58" rx="6" fill="#58C8FF"/>
    <text x="24" y="294" class="card-copy">
      <tspan x="24" dy="0">Estrutura mais fina</tspan>
      <tspan x="24" dy="18">Ombros e punhos menores</tspan>
      <tspan x="24" dy="18">Mais dificuldade para</tspan>
      <tspan x="24" dy="18">ganhar peso</tspan>
    </text>
  </g>

  <g transform="translate(265 126)">
    <rect width="190" height="414" rx="20" fill="#0F1622" stroke="#48FF9F" stroke-opacity="0.35"/>
    <text x="24" y="36" class="card-title" fill="#E7FFF1">MESOMORFO</text>
    <ellipse cx="95" cy="84" rx="24" ry="25" fill="#48FF9F"/>
    <rect x="80" y="108" width="30" height="84" rx="14" fill="#48FF9F"/>
    <rect x="56" y="116" width="16" height="76" rx="8" fill="#48FF9F"/>
    <rect x="118" y="116" width="16" height="76" rx="8" fill="#48FF9F"/>
    <rect x="78" y="192" width="14" height="62" rx="7" fill="#48FF9F"/>
    <rect x="98" y="192" width="14" height="62" rx="7" fill="#48FF9F"/>
    <text x="24" y="294" class="card-copy">
      <tspan x="24" dy="0">Aparencia mais atletica</tspan>
      <tspan x="24" dy="18">Boa resposta a treino</tspan>
      <tspan x="24" dy="18">e dieta</tspan>
      <tspan x="24" dy="18">Ganho muscular mais</tspan>
      <tspan x="24" dy="18">equilibrado</tspan>
    </text>
  </g>

  <g transform="translate(490 126)">
    <rect width="190" height="414" rx="20" fill="#0F1622" stroke="#FFC94D" stroke-opacity="0.35"/>
    <text x="24" y="36" class="card-title" fill="#FFF4D8">ENDOMORFO</text>
    <ellipse cx="95" cy="84" rx="25" ry="25" fill="#FFC94D"/>
    <rect x="72" y="108" width="46" height="88" rx="20" fill="#FFC94D"/>
    <rect x="52" y="122" width="16" height="74" rx="8" fill="#FFC94D"/>
    <rect x="122" y="122" width="16" height="74" rx="8" fill="#FFC94D"/>
    <rect x="78" y="196" width="16" height="58" rx="8" fill="#FFC94D"/>
    <rect x="98" y="196" width="16" height="58" rx="8" fill="#FFC94D"/>
    <text x="24" y="294" class="card-copy">
      <tspan x="24" dy="0">Estrutura mais larga</tspan>
      <tspan x="24" dy="18">Maior facilidade para</tspan>
      <tspan x="24" dy="18">ganhar peso</tspan>
      <tspan x="24" dy="18">Pede mais controle</tspan>
      <tspan x="24" dy="18">de rotina</tspan>
    </text>
  </g>

  <text x="40" y="578" class="footer-copy">
    <tspan x="40" dy="0">Biotipo e apenas uma pista inicial. Medidas, composicao corporal</tspan>
    <tspan x="40" dy="20">e avaliacao profissional valem mais.</tspan>
  </text>

  <defs>
    <linearGradient id="panel" x1="40" y1="36" x2="680" y2="592" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A2A"/>
      <stop offset="1" stop-color="#0B111B"/>
    </linearGradient>
  </defs>
</svg>
